[project]
name = "django-weekly-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.7",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
docker = [
    "gunicorn>=26.0.0",
    "whitenoise>=6.12.0",
]

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
